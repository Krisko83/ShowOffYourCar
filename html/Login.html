<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Patrick" />
    <meta
      name="description"
      content="Login page for the Cars Dealership website."
    />
    <meta
      name="keywords"
      content="cars, dealership, login, username, password"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Login Page</title>
    <link rel="stylesheet" href="../Style/Style.css" />
  </head>
  <body class="background-login">
    <div class="login-box">
      <h2 class="login-title">Login</h2>

      <form id="loginForm">
        <!-- Email Input -->
        <div>
          <input
            type="email"
            id="email"
            class="input-username"
            placeholder="Email"
            required
          />
          <div class="line" id="Uline"></div>
        </div>

        <!-- Password Input -->
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            class="input-password"
            placeholder="Password"
            minlength="8"
            required
          />
          <span class="eyebox" id="toggleEye">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </span>
        </div>
        <div class="line" id="Pline"></div>

        <!-- Action Message -->
        <div>
          <p class="action" id="action">Awaiting Action...</p>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="login-btn">Log In</button>
        </div>
      </form>

      <div class="register-section">
        <a class="register-link" href="Signup.html"
          >Don't Have Account? Register!</a
        >
        <div class="forgot-section">
          <a class="forgot-link" href="SendOTP.html">Forgot Password?</a>
        </div>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const actionText = document.getElementById("action");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        actionText.innerText = "Logging in...";
        actionText.style.color = "white";
        actionText.style.fontWeight = "normal";

        try {
          const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();

          if (response.ok) {
            localStorage.setItem("authToken", result.token);

            // Success: Green and Bold
            actionText.innerText = "Login complete!";
            actionText.style.color = "#28a745";
            actionText.style.fontWeight = "bold";

            setTimeout(() => {
              window.location.href = "index.html";
            }, 1000);
          } else {
            // Error: Red, Bold, and no "Error:" prefix
            actionText.innerText = result.message;
            actionText.style.color = "#dc3545";
            actionText.style.fontWeight = "bold";
          }
        } catch (err) {
          // Server error: Red and Bold
          actionText.innerText = "Server is not responding!";
          actionText.style.color = "#dc3545";
          actionText.style.fontWeight = "bold";
        }
      });
    </script>
    <script src="../Script/Script.js"></script>
  </body>
</html>
